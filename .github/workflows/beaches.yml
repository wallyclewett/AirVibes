name: Update beach list

on:
  push:
    paths: [scripts/build-beaches.mjs, .github/workflows/beaches.yml]
  schedule:
    - cron: "17 3 1 * *" # monthly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-beaches.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add beaches.json
          git diff --cached --quiet || (git commit -m "Update beach list" && git push)
