name: Build Mac app

on:
  push:
    branches: [main]
    paths: [mac/**, .github/workflows/mac.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build AirVibes.app
        run: |
          swift --version
          mac/build-app.sh 2>&1 | tee build.log
      - name: Publish to the "mac-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mac-latest >/dev/null 2>&1 || gh release create mac-latest --prerelease \
            --title "AirVibes for Mac (latest build)" \
            --notes "Menu bar wind checker. Download AirVibes-mac.zip, unzip, move AirVibes.app to Applications. First launch: right-click the app, choose Open, then Open again (it isn't notarised by Apple)."
          gh release upload mac-latest mac/build/AirVibes-mac.zip --clobber
      - name: Keep the build log if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
